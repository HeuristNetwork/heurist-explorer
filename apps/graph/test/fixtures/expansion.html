<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Expansion overlap fixture</title>
<style>.heurist-graph-canvas {height:100vh}</style>
<main id="graph" class="heurist-graph"></main><output id="status" style="position:absolute;bottom:10px;left:10px;background:white;padding:8px;z-index:1000"></output>
<script type="module">
import '../../src/style.css';
import '@fortawesome/fontawesome-free/css/fontawesome.min.css';
import '@fortawesome/fontawesome-free/css/solid.min.css';
import { GraphApplication } from '../../src/core/GraphApplication.js';
import { GraphDocument } from '../../src/core/GraphDocument.js';
import { HeuristGraphPublicApi } from '../../src/host/HeuristGraphPublicApi.js';
import { GraphControlPanel } from '../../src/ui/GraphControlPanel.js';
import { createGraphEngine } from '../../src/engine/createGraphEngine.js';
const rules = [
  {name:'Person → Events → Places',description:'Person → Life Events → Events → Location → Places',query:{'lf:240':[{t:10}],t:48},levels:[{query:{'lf:134':[{t:48}],t:12}}]},
  {name:'Person → Places',description:'An independent path to the same Place',query:{'lf:241':[{t:10}],t:12}}
];
const makeGraph = (ids, edges=[]) => new GraphDocument({records:ids.map(id=>({id,title:({1:'Person',2:'Event',3:'Place'})[id],recordTypeId:({1:10,2:48,3:12})[id]})),edges});
const app = new GraphApplication({config:{query:'t:10',rules,limits:{maxNodes:100,maxEdges:100},engineOptions:{movement:'freeze'}},
  host:{initialize:async()=>{},supportsEditing:()=>false},engine:createGraphEngine(),
  provider:{load:async request=>{
    if(!request.rule) return {graph:makeGraph([1]),total:1};
    const field = Object.keys(request.rule.query).find(k=>k.startsWith('lf:')).slice(3);
    const target = field==='240'?2:3, from=field==='134'?2:1;
    return {graph:makeGraph([...new Set([...request.query.ids,target])],[{from,to:target,fieldId:Number(field)}]),expansion:{targetIds:[target]}};
  }}});
const container = document.querySelector('#graph'), canvas=document.createElement('div');
canvas.className='heurist-graph-canvas';container.append(canvas);
const api = new HeuristGraphPublicApi(app);
await app.initialize(canvas);
await new GraphControlPanel({api,container,datasetListProvider:{list:async()=>[]},filterListProvider:{list:async()=>[]}}).mount();
const status=()=>{document.querySelector('#status').textContent=`Nodes: ${app.graph.recordIds.join(', ')}; Edges: ${app.graph.edges.length}`;};
app.addEventListener('heurist-graph-expansions-changed',status);status();
</script></html>
